services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: expense_pass
      POSTGRES_DB: expense_tracker
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U expense_user -d expense_tracker" ]
      interval: 2s
      timeout: 2s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:-compose-test-key}
      DATABASE_URL: postgresql://expense_user:expense_pass@db:5432/expense_tracker
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
