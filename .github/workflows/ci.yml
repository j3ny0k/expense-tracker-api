name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      API_KEY: ci-test-key
      SMOKE_BASE_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t expense-tracker-api .

      - name: Start API container
        run: docker run -d --name expense-tracker-api-ci -p 8000:8000 -e API_KEY=$API_KEY expense-tracker-api

      - name: Wait for API
        run: curl --fail --retry 10 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/health

      - name: Run smoke test
        run: python smoke.py
